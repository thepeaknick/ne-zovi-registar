<!--<c-header class="mb-4 d-print-none" position="sticky">-->

<c-container class="headerContainer">
  <c-row class="defaultHeader">
    <c-col xs="9">
      <p class="headerTitle">Aministratorska platforma</p>
    </c-col>
    <c-col xs="3">
      <c-header-nav class="ms-3" id="accountData">
        <ng-container *ngTemplateOutlet="userDropdown"></ng-container>
      </c-header-nav>
    </c-col>
  </c-row>
</c-container>

<ng-template #userDropdown>
  <button cButton color="secondary" variant="ghost" (click)="logout()">
    {{ authenticationService.CurrentUser?.firstName }}
    {{ authenticationService.CurrentUser?.lastName }}
    [ {{ authenticationService.CurrentUser?.companyName }} ]
  </button>
</ng-template>
<!--</c-header>-->
