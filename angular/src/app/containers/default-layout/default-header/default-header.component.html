<!--<c-header class="mb-4 d-print-none" position="sticky">-->

<c-container class="headerContainer">
  <c-row class="defaultHeader">
    <c-col xs="8" class="headerColumn">
      <button
        toggle="visible"
        cHeaderToggler
        [cSidebarToggle]="sidebarId"
        class="ps-1"
      >
        <svg 
          [cIcon]="icons.cilMenu"
          size="lg"
        ></svg>
      </button>
      <p class="headerTitle">Administratorska platforma</p>
    </c-col>
    <c-col xs="4" class="headerColumn">
      <div class="userColumn">Username: {{ currentUsername }}</div>
      <div class="userColumn">
        <button cButton color="secondary" variant="ghost" (click)="logout()" class="userColumn">
          {{ authenticationService.CurrentUser?.firstName }}
          {{ authenticationService.CurrentUser?.lastName }}
          [ {{ authenticationService.CurrentUser?.companyName }} ]
        </button>
      </div>
    </c-col>
  </c-row>
</c-container>
