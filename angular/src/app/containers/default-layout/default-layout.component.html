<!--sidebar-->
<c-sidebar
  #sidebar="cSidebar"
  class="d-print-none sidebar sidebar-fixed"
  id="sidebar"
  visible
  [ngStyle]="vars"
>
  <c-sidebar-brand
    [brandFull]="{
      src: 'assets/brand/ratellogolightvertical.png',
      width: 160,
      margin: 10,
      alt: 'CoreUI Logo'
    }"
    [brandNarrow]="{
      src: 'assets/brand/ratellogolightvertical.png',
      width: 46,
      alt: 'CoreUI Logo'
    }"
    routerLink="./"
  >
  </c-sidebar-brand>

  <c-sidebar-nav [navItems]="navItems" dropdownMode="path"> 
    <button
      [cModalToggle]="verticallyCenteredModal.id"
      type="button"
      class="signoutSidebarButton">
      <svg [cIcon]="icons.cilExitToApp" class="signoutIcon"></svg>
      Sign out
    </button>
  </c-sidebar-nav>

  <c-sidebar-toggler
    *ngIf="!sidebar.narrow"
    toggle="unfoldable"
    cSidebarToggle="sidebar"
  ></c-sidebar-toggler>
  <div *ngIf="role == 1">Admin role: {{ role }}</div>
  <div *ngIf="role == 2">Operater role: {{ role }}</div>
  <div *ngIf="role == 3">Trgovac role: {{ role }}</div>
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 bg-light dark:bg-transparent">
  <!--app-header-->
  <app-default-header
    class="mb-4 d-print-none header header-sticky"
    position="sticky"
    sidebarId="sidebar"
  ></app-default-header>
  <!--app-body-->
  <div class="body flex-grow-1 px-3">
    <c-container breakpoint="lg" class="h-auto">
      <router-outlet></router-outlet>
    </c-container>
  </div>
  <!--app footer-->
  <!-- <app-default-footer></app-default-footer> -->
  
</div>


<c-modal
      #verticallyCenteredModal
      alignment="center"
      id="verticallyCenteredModal"
    >
    <c-modal-header>
        <p class="modalHeader">Pokušacate da napustite stranicu registra "Ne zovi"</p>
        <button [cModalToggle]="verticallyCenteredModal.id" cButtonClose></button>
      </c-modal-header>
      <c-modal-body>
        <p class="modalBodyTitle">Da li ste sigurni?</p>
        <form cForm>
          <input cButton class="signOutButton" type="submit" value="Sign out"/>
          <input cButton class="cancelButton" type="submit" value="Cancel" [cModalToggle]="verticallyCenteredModal.id"/>
        </form>
      </c-modal-body>
</c-modal>
