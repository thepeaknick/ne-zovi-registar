<ng-container *transloco="let t">
  <c-header>
    <c-container>
      <c-row>
        <c-col xs="3">
          <a class="header-brand" href="#">
            <img
              src="/assets/brand/ratellogo.png"
              alt=""
              class="headerImage"
              alt="Ratel Logo"
            />
          </a>
        </c-col>
        <c-col xs="6">
          <span>
            <h2> {{ t('Dobrodošli u registar') }}</h2>
          </span>
          <button (click)="changeLanguage('en')">Engleski</button>
          <button (click)="changeLanguage('lat')">Latinica</button>
          <button (click)="changeLanguage('cir')">Cirilica</button>
        </c-col>
        <c-col xs="3"> 
          <div class="headerButtonView">
          <button
            *ngIf="isLogin"
            cButton
            color="secondary"
            variant="ghost"
            (click)="goBack()"
            class="headerButton"
          >
            <img src="/assets/icons/loginicon.svg" class="headerButtonImage"/><span>{{ t('Nazad') }}</span>
          </button>

          <button
            *ngIf="isSearch"
            cButton
            color="secondary"
            variant="ghost"
            (click)="goToSignIn()"
            class="headerButton"
          >
            <img src="/assets/icons/loginicon.svg" class="headerButtonImage"/><span>{{ t('Prijavi se') }}</span>
          </button>
        </div>
        </c-col>  
      </c-row>
    </c-container>
  </c-header>
</ng-container>
