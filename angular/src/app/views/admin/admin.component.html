<div class="adminScreen">
  <c-row>
    <c-col md="4" xl="4">
      <c-widget-stat-f
        [title]="'Broj operatora'"
        class="mb-3 widgetStats"
        color="primary"
        padding
        value="{{ regUsers.length }}"
      >
        <ng-template cTemplateId="widgetIconTemplate">
          <svg [cIcon]="icons.cilChartPie" size="xl" width="24"></svg>
        </ng-template> </c-widget-stat-f
    ></c-col>
    <c-col md="4" xl="4">
      <c-widget-stat-f
        [title]="'Broj trgovaca'"
        class="mb-3 widgetStats"
        color="info"
        padding
        value="{{ merchants.length }}"
      >
        <ng-template cTemplateId="widgetIconTemplate" class="widgetStatsUpper">
          <svg [cIcon]="icons.cilChartPie" size="xl" width="24"></svg>
        </ng-template> </c-widget-stat-f
    ></c-col>
    <c-col md="4" xl="4">
      <c-widget-stat-f
        [title]="'Broj korisničkih brojeva'"
        class="mb-3 widgetStats"
        color="secondary"
        padding
        value="{{ users.length }}"
      >
        <ng-template cTemplateId="widgetIconTemplate">
          <svg [cIcon]="icons.cilChartPie" size="xl" width="24"></svg>
        </ng-template> </c-widget-stat-f
    ></c-col>
  </c-row>
  <c-row>
    <c-col md="4" xl="4">
      <c-widget-stat-a
        class="mb-4, widgetView"
        title="{{ yettelUsers.length + '' }}"
      >
        <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
          <img src="../../../assets/brand/yettel.svg" />
          Yettel
          <!-- <span class="fs-6 fw-normal">
            (15.6% <svg [cIcon]="icons.cilArrowTop"></svg>)
          </span> -->
        </ng-template>
        <ng-template cTemplateId="widgetChartTemplate">
          <c-chart
            [data]="data1"
            [options]="options1"
            class="mt-3 mx-3"
            height="110"
            type="line"
          ></c-chart>
        </ng-template>
      </c-widget-stat-a>
    </c-col>
    <c-col md="4" xl="4">
      <c-widget-stat-a
        class="mb-4, widgetView"
        title="{{ mtsUsers.length + '' }}"
      >
        <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
          <img src="../../../assets/brand/mts.svg" />
          mts
          <!-- <span class="fs-6 fw-normal">
            (12,7% <svg [cIcon]="icons.cilArrowTop"></svg>)
          </span> -->
        </ng-template>
        <ng-template cTemplateId="widgetChartTemplate">
          <c-chart
            [data]="data2"
            [options]="options2"
            class="mt-3 mx-3"
            height="110"
            type="line"
          ></c-chart>
        </ng-template>
      </c-widget-stat-a>
    </c-col>
    <c-col md="4" xl="4">
      <c-widget-stat-a
        class="mb-4, widgetView"
        title="{{ a1Users.length + '' }}"
      >
        <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
          <img src="../../../assets/brand/a1.svg" />
          A1
          <!-- <span class="fs-6 fw-normal">
            (-12.7% <svg [cIcon]="icons.cilArrowBottom"></svg>)
          </span> -->
        </ng-template>
        <ng-template cTemplateId="widgetChartTemplate">
          <c-chart
            [data]="data3"
            [options]="options3"
            class="mt-3 mx-3"
            height="110"
            type="line"
          ></c-chart>
        </ng-template>
      </c-widget-stat-a>
    </c-col>
  </c-row>

  <div class="charts">
    <c-row>
      <c-col md="8" xl="8">
        <div class="chartView">
          <c-row>
            <c-col>
              <p class="lineChartTitle">Pregled</p>
            </c-col>
            <c-col class="chartExportData">
              <button
                cButton
                class="lineChartButton"
                color="white"
                shape="rounded-pill"
                (click)="exportExcel()"
              >
                Export data
              </button>
            </c-col>
          </c-row>
          <c-chart
            [data]="dataLineChart"
            type="line"
            (chartRef)="handleChartRef($event)"
          >
          </c-chart>
        </div>
      </c-col>
      <c-col md="4" xl="4">
        <div class="chartView pieChart">
          <p class="pieChartTitle">Top tri operatera</p>
          <c-chart [data]="dataPieChart" type="doughnut"> </c-chart>
        </div>
      </c-col>
    </c-row>
  </div>
</div>
