<div class="backgroundImage">
  <div class="body flex-grow-1 px-3">
    <c-container breakpoint="lg" class="h-auto">
      <c-row>
        <c-col xs="0" sm="5" md="7"></c-col>
        <c-col xs="12" sm="7" md="5" class="backgroundView">
          <div class="content">
            <c-row>
              <c-col>
                <p class="titleText">Pretraga <br />telefonskog broja</p>
              </c-col>
              <c-col> </c-col>
            </c-row>
            <form cForm (ngSubmit)="checkNumber()">
              <div class="mb-3">
                <label cLabel for="phoneNumber" class="phoneNumberText"
                  >Broj telefona</label
                >
                <input
                  cFormControl
                  id="phoneNumber"
                  type="text"
                  name="phoneNumber"
                  [(ngModel)]="phoneNumber"
                />
              </div>
              <div class="recaptcha">
                <re-captcha
                  id="recaptcha"
                  name="recaptcha"
                  #recaptcha="ngModel"
                  [(ngModel)]="token"
                  required
                  [class.is-invalid]="
                    recaptcha.invalid && (recaptcha.dirty || recaptcha.touched)
                  "
                ></re-captcha>
                <div
                  *ngIf="
                    (recaptcha.invalid &&
                      (recaptcha.dirty || recaptcha.touched)) ||
                    showCaptchaMessage
                  "
                >
                  <div *ngIf="recaptcha.errors?.['required']">
                    Morate popuniti Captcha-u.
                  </div>
                </div>
              </div>
              <input
                cButton
                class="submitButton"
                type="submit"
                value="Pretraga"
              />
              <h2
                *ngIf="showSearchMessage && isFound"
                class="searchResultText green"
              >
                TELEFONSKI BROJ JE REGISTROVAN U BAZI
              </h2>
              <h2
                *ngIf="showSearchMessage && !isFound"
                class="searchResultText red"
              >
                TELEFONSKI BROJ NIJE REGISTROVAN U BAZI
              </h2>
              <p class="descriptionText">
                Lorem ipsum lorem ipsum lorem ipsum lorem ipsum lorem ipsum
                lorem ipsum lorem ipsum lorem ipsum lorem ipsum
              </p>
            </form>
          </div>
        </c-col>
      </c-row>
    </c-container>
  </div>
</div>
