<c-container breakpoint="lg" class="h-auto home-bck">
  <router-outlet></router-outlet>
  <c-row class="aaaa">
    <c-col xs="8"></c-col>
    <c-col xs="4">
      <form cForm>
        <div class="mb-3">
          <label cLabel for="inputPhone">Broj telefona</label>
          <input cFormControl id="inputPhone" type="email" />
        </div>
        <c-form-check class="mb-3">
          <input cFormCheckInput id="checkMeOut-1" type="checkbox" />
          <label cFormCheckLabel for="checkMeOut-1">Pretraga</label>
        </c-form-check>
        <input cButton color="primary" type="submit" />
      </form>
    </c-col>
  </c-row>

  <c-modal
    #verticallyCenteredModal
    alignment="center"
    [visible]="true"
    id="verticallyCenteredModal"
  >
    <c-modal-header>
      <button [cModalToggle]="verticallyCenteredModal.id" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
      <img src="/assets/images/exclamationmark.png" />
      <h5 cModalTitle>Zaboravljena lozinka</h5>
      Unesite vašu e-mail adresu a koju će biti poslat<br />
      link za promenu vaše lozinke

      <form cForm>
        <div class="mb-1">
          <input cFormControl id="inputEmail" type="email" />
        </div>
        <input cButton color="primary" type="submit" value="Pošalji" />
      </form>
    </c-modal-body>
    <c-modal-footer>
      <button cButton color="secondary" variant="ghost">
        <img src="/assets/icons/loginicon.svg" /><span
          >Vrati se na sign in</span
        >
      </button>
    </c-modal-footer>
  </c-modal>

  <c-offcanvas
    placement="bottom"
    id="OffcanvasBottom"
    [visible]="true"
    [keyboard]="true"
    class="text-bg-dark"
  >
    <c-offcanvas-body>
      <c-container fluid>
        <span>
          <p>Politika kolačića Ratel. Do 200 karaktera.</p>
          <p>Politika kolačića Ratel. Do 200 karaktera.</p>
        </span>
        <button
          cButton
          color="primary"
          cOffcanvasToggle="OffcanvasBottom"
          class="text-reset"
          aria-label="Close"
        >
          Prihvati
        </button>
      </c-container>
    </c-offcanvas-body>
  </c-offcanvas>
</c-container>
