<div class="backgroundImage">
  <div class="body flex-grow-1 px-3">
    <c-container breakpoint="lg" class="h-auto">
      <c-row>
        <c-col xs="0" sm="4" md="4"></c-col>
        <c-col xs="12" sm="8" md="8" class="backgroundView">
          <div class="content">
            <p class="modalTitleText">Podaci o trgovcu</p>
            <form
              cForm
              class="row g-3"
              [formGroup]="regUserForm"
              novalidate
              [validated]="isValidated"
            >
              <c-col [xs]="8">
                <div class="mb-3">
                  <label cLabel for="regUserName" class="textInputField">
                    Ime trgovca
                  </label>
                  <input
                    required
                    cFormControl
                    formControlName="regUserName"
                    id="regUserName"
                    type="text"
                    placeholder="Ime"
                  />
                </div>
                <div class="mb-3">
                  <label cLabel for="regUserAddress" class="textInputField">
                    Adresa trgovca
                  </label>
                  <input
                    required
                    cFormControl
                    formControlName="regUserAddress"
                    id="regUserAddress"
                    type="text"
                    placeholder="Adresa"
                  />
                </div>
                <div class="mb-3">
                  <c-row>
                    <c-col>
                      <label
                        cLabel
                        for="regUserFirstName"
                        class="textInputField"
                      >
                        Ime
                      </label>
                      <input
                        required
                        cFormControl
                        formControlName="regUserFirstName"
                        id="regUserFirstName"
                        type="text"
                        placeholder="Ime odgovornog lica"
                      />
                    </c-col>
                    <c-col>
                      <label
                        cLabel
                        for="regUserLastName"
                        class="textInputField"
                      >
                        Prezime
                      </label>
                      <input
                        required
                        cFormControl
                        formControlName="regUserLastName"
                        id="regUserLastName"
                        type="text"
                        placeholder="Prezime odgovornog lica"
                      />
                    </c-col>
                  </c-row>
                </div>
                <div class="mb-3">
                  <c-row>
                    <c-col>
                      <label
                        cLabel
                        for="regUserUsername"
                        class="textInputField"
                      >
                        Korisničko ime
                      </label>
                      <input
                        required
                        minlength="8"
                        cFormControl
                        formControlName="regUserUsername"
                        id="regUserUsername"
                        type="text"
                        placeholder="Username"
                      />
                    </c-col>
                    <c-col>
                      <label
                        cLabel
                        for="regUserPassword"
                        class="textInputField"
                      >
                        Lozinka
                      </label>
                      <input
                        required
                        minlength="8"
                        cFormControl
                        formControlName="regUserPassword"
                        id="regUserPassword"
                        type="text"
                        placeholder="xxxxxxxxx"
                      />
                    </c-col>
                  </c-row>
                </div>
                <div class="mb-3">
                  <label cLabel for="regUserEmail" class="textInputField">
                    E-mail
                  </label>
                  <input
                    required
                    email
                    cFormControl
                    formControlName="regUserEmail"
                    id="regUserEmail"
                    type="email"
                    placeholder="Email adresa"
                  />
                </div>
              </c-col>
              <c-col [xs]="4">
                <div class="mb-3">
                  <label cLabel for="regUserPIB" class="textInputField"
                    >PIB</label
                  >
                  <input
                    required
                    minlength="9"
                    maxlength="9"
                    pattern="[0-9]*"
                    cFormControl
                    formControlName="regUserPIB"
                    id="regUserPIB"
                    type="text"
                    placeholder="xxxxxxxxx"
                  />
                </div>
                <div class="mb-3">
                  <label cLabel for="regUserMB" class="textInputField"
                    >Matični broj</label
                  >
                  <input
                    required
                    minlength="8"
                    maxlength="8"
                    pattern="[0-9]*"
                    cFormControl
                    formControlName="regUserMB"
                    id="regUserMB"
                    type="text"
                    placeholder="xxxxxxxxx"
                  />
                </div>
              </c-col>
              <div class="mb-3">
                <input
                  cButton
                  class="submitButton"
                  type="submit"
                  value="Dodaj trgovca"
                  (click)="addRegUser()"
                />
                <input
                  cButtonClose
                  class="cancelButton"
                  type="submit"
                  value="Nazad"
                  (click)="goBack()"
                />
              </div>
            </form>
          </div>
        </c-col>
      </c-row>
    </c-container>

    <c-modal
      #confirmNewReguserModal
      alignment="center"
      id="confirmNewReguserModal"
      [visible]="isSuccessfulyRegisteredUserModalVisible"
      backdrop="static"
    >
      <c-modal-header>
        <button (click)="resetFields()" cButtonClose></button>
      </c-modal-header>

      <c-modal-body>
        <img src="/assets/images/exclamationmark.png" class="modalImage" />
        <p cModalTitle class="modalTitle">
          Uspešno ste registrovali novog trgovca
        </p>
        <p class="modalSubtitle"></p>
      </c-modal-body>
      <c-modal-footer>
        <input
          cButton
          class="modalSubmitButton"
          type="submit"
          value="U redu"
          (click)="resetFields()"
        />
      </c-modal-footer>
    </c-modal>
  </div>
</div>
