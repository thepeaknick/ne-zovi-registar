<div class="backgroundImage">
  <div class="regusersTable">
    <c-row>
      <c-col xs="6" class="leftTableHeader">
        <button
          cButton
          [cModalToggle]="addNewReguserModal.id"
          type="button"
          class="tableAddNewButton"
          shape="rounded-pill"
        >
          + Dodaj novog obveznika
        </button>
      </c-col>
      <c-col xs="6" class="rightTableHeader">
        <button
          [cPopover]="popoverHtml"
          cPopoverPlacement="bottom"
          [cPopoverTrigger]="'click'"
          cButton
          class="tableButton"
          color="white"
          shape="rounded-pill"
        >
          Prikaz po strani &#8659;
          <ng-template #popoverHtml>
            <div class="popover-body">10<br />20<br />30<br />40<br />50</div>
          </ng-template>
        </button>
        <button cButton class="tableButton" color="white" shape="rounded-pill">
          Export data
        </button>
      </c-col>
    </c-row>
    <div class="tableData">
      <table cTable hover>
        <thead class="tableHeader">
          <tr>
            <th scope="col">Ime firme</th>
            <th scope="col">PIB</th>
            <th scope="col">Matični broj</th>
            <th scope="col">Datum upisa</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody class="tableContent">
          <tr *ngFor="let item of regUsers">
            <td>{{ item.name }}</td>
            <td>{{ item.taxNumber }}</td>
            <td>{{ item.regNumber }}</td>
            <td>{{ item.createdOn | date : "dd MMM, YY" }}</td>
            <td>edit</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <c-modal
    #addNewReguserModal
    alignment="center"
    id="addNewReguserModal"
    size="lg"
  >
    <c-modal-header>
      <p class="modalHeader">Dodaj novog obveznika</p>
      <button [cModalToggle]="addNewReguserModal.id" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
      <p class="modalTitleText">Podaci o obvezniku</p>
      <form cForm class="row g-3" [formGroup]="regUserForm">
        <c-col [xs]="8">
          <div class="mb-3">
            <label cLabel for="regUserName" class="textInputField">
              Ime obveznika
            </label>
            <input
              cFormControl
              formControlName="regUserName"
              id="regUserName"
              type="text"
              placeholder="Ime"
            />
          </div>
          <div class="mb-3">
            <label cLabel for="regUserAddress" class="textInputField">
              Adresa obveznika
            </label>
            <input
              cFormControl
              formControlName="regUserAddress"
              id="regUserAddress"
              type="text"
              placeholder="Adresa"
            />
          </div>
          <div class="mb-3">
            <c-row>
              <c-col>
                <label cLabel for="regUserFirstName" class="textInputField">
                  Ime
                </label>
                <input
                  cFormControl
                  formControlName="regUserFirstName"
                  id="regUserFirstName"
                  type="text"
                  placeholder="Ime odgovornog lica"
                />
              </c-col>
              <c-col>
                <label cLabel for="regUserLastName" class="textInputField">
                  Prezime
                </label>
                <input
                  cFormControl
                  formControlName="regUserLastName"
                  id="regUserLastName"
                  type="text"
                  placeholder="Prezime odgovornog lica"
                />
              </c-col>
            </c-row>
          </div>
          <div class="mb-3">
            <c-row>
              <c-col>
                <label cLabel for="regUserUsername" class="textInputField">
                  Korisničko ime
                </label>
                <input
                  cFormControl
                  formControlName="regUserUsername"
                  id="regUserUsername"
                  type="text"
                  placeholder="Username"
                />
              </c-col>
              <c-col>
                <label cLabel for="regUserPassword" class="textInputField">
                  Lozinka
                </label>
                <input
                  cFormControl
                  formControlName="regUserPassword"
                  id="regUserPassword"
                  type="text"
                  placeholder="xxxxxxxxx"
                />
              </c-col>
            </c-row>
          </div>
          <div class="mb-3">
            <label cLabel for="regUserEmail" class="textInputField">
              E-mail
            </label>
            <input
              cFormControl
              formControlName="regUserEmail"
              id="regUserEmail"
              type="email"
              placeholder="Email adresa"
            />
          </div>
        </c-col>
        <c-col [xs]="4">
          <div class="mb-3">
            <label cLabel for="pib" class="textInputField">PIB</label>
            <input
              cFormControl
              formControlName="regUserPIB"
              id="regUserPIB"
              type="text"
              placeholder="xxxxxxxxx"
            />
          </div>
          <div class="mb-3">
            <label cLabel for="mb" class="textInputField">Matični broj</label>
            <input
              cFormControl
              formControlName="regUserMB"
              id="regUserMB"
              type="text"
              placeholder="xxxxxxxxx"
            />
          </div>
        </c-col>
        <div class="mb-3">
          <input
            cButton
            class="submitButton"
            type="submit"
            value="Dodaj obveznika"
            (click)="addRegUsers()"
          />
          <input
            [cModalToggle]="addNewReguserModal.id"
            cButtonClose
            class="cancelButton"
            type="submit"
            value="Cancel"
          />
        </div>
      </form>
    </c-modal-body>
  </c-modal>
</div>
