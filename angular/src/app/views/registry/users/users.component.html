<div class="backgroundImage">
  <div class="regusersTable">
    <c-row>
      <c-col xs="6" class="leftTableHeader">
        <button
          cButton
          [cModalToggle]="addNewUserModal.id"
          type="button"
          class="tableAddNewButton"
          shape="rounded-pill"
        >
          + Dodaj novog korisnika
        </button>
      </c-col>
      <c-col xs="6" class="rightTableHeader">
        <button
          [cPopover]="popoverHtml"
          cPopoverPlacement="bottom"
          [cPopoverTrigger]="'click'"
          cButton
          class="tableButton"
          color="white"
          shape="rounded-pill"
        >
          Prikaz po strani &#8659;
          <ng-template #popoverHtml>
            <div class="popover-body">10<br />20<br />30<br />40<br />50</div>
          </ng-template>
        </button>
      </c-col>
    </c-row>
    <div class="tableData">
      <table cTable hover>
        <thead class="tableHeader">
          <tr>
            <th scope="col">Broj telefona</th>
            <th scope="col">Datum upisa/ispisa</th>
            <th scope="col">Izmena podataka</th>
            <th scope="col">Obriši broj telefona</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody class="tableContent">
          <tr *ngFor="let item of users">
            <td>{{ item.phoneNumber }}</td>
            <td>{{ item.createdModifiedOn | date : "dd MMM, YY" }}</td>
            <td><img src="assets/images/editImage.svg"></td>
            <td><img src="assets/images/trashCan.png" /></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <c-modal #addNewUserModal alignment="center" id="addNewUserModal" size="lg">
    <c-modal-header>
      <p class="modalHeader">Dodaj novog korisnika</p>
      <button [cModalToggle]="addNewUserModal.id" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
      <form cForm class="row g-3" [formGroup]="addNewUserForm">
        <c-row>
          <c-col [xs]="9">
            <div class="mb-3">
              <p class="modalTitleText">Podaci o korisniku</p>
            </div>
          </c-col>
          <c-col [xs]="3">
            <div class="mb-3">
              <input
                cButton
                class="addPhoneButton"
                value="+ broj telefona"
                (click)="createDiv()"
              />
            </div>
          </c-col>
        </c-row>
        
        <c-row>
            <c-col [xs]="8" id="phoneNumberCol">
            <label cLabel for="phoneNumber" class="textInputField">
              Broj telefona korisnika
            </label>
            <div *ngFor="let div of divs; let i=index" class="mb-3" id="phoneNumber{{ div }}" formControlName="phoneNumber[{{i}}]">
              <input
                cFormControl
                id="phoneNumber"
                type="text"
                placeholder="xxxxxxxxx"
              />
            </div>
            </c-col>
            <c-col [xs]="4" id="operatorCol">
              <label cLabel for="pib" class="textInputField">Operator</label>
              <div class="mb-3" *ngFor="let div of divs; let i = index" id="operatorName{{ div }}" formControlName="operatorName[{{i}}]">
                <select aria-label="Default select example" cSelect>
                  <option value="1">Yettel</option>
                  <option value="2">mts</option>
                  <option value="3">A1</option>
                </select>
              </div>
            </c-col>
        </c-row>
        




        
        <c-col [xs]="8" id="phoneNumberCol">
          <div class="mb-3">
            <c-row>
              <c-col>
                <label cLabel for="firstName" class="tesxtInputField">
                  Ime
                </label>
                <input
                  cFormControl
                  id="firstName"
                  type="text"
                  placeholder="Ime korisnika"
                />
              </c-col>
              <c-col>
                <label cLabel for="lastName" class="textInputField">
                  Prezime
                </label>
                <input
                  cFormControl
                  id="lastName"
                  type="text"
                  placeholder="Prezime korisnika"
                />
              </c-col>
            </c-row>
          </div>
        </c-col>
        <c-col [xs]="4" id="operatorCol">
          <div class="mb-3">
            <label cLabel for="jmbg" class="textInputField">JMBG</label>
            <input cFormControl id="jmbg" type="text" placeholder="xxxxxxxxxxxxx" />
          </div>
        </c-col>
        <div class="mb-3">
          <input
            cButton
            class="submitButton"
            type="submit"
            value="Dodaj korisnika"
            (click)="submitNewUser()"
          />
          <input
            [cModalToggle]="addNewUserModal.id"
            cButtonClose
            class="cancelButton"
            value="Cancel"
            (click)="cancelNewUser()"
            />
        </div>
      </form>
    </c-modal-body>
  </c-modal>
</div>
